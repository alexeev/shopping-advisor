[project]
name = "shopping-advisor"
version = "0.2.0"
description = "Evidence-backed shopping research: briefs, acquisition, validation, comparison and replayable studies"
requires-python = ">=3.14,<3.15"
dependencies = [
    # 2.19.x is the validated runtime. Scrapy's minor releases regularly move
    # defaults (the scheduler priority queue, the download handler, the
    # start-request API), so the upper bound is deliberate: bumping it is a
    # decision that deserves its own regression run.
    "scrapy>=2.19.0,<2.20",
]

[project.optional-dependencies]
# Optional ScrapeOps proxy/monitoring integration, used only by the opt-in
# `shopping_advisor.settings_scrapeops` profile. The default profile is
# proxy-free and does not need these.
scrapeops = [
    "scrapeops-scrapy>=0.6.1",
    "scrapeops-scrapy-proxy-sdk>=1.1",
]

[tool.uv]
# Run the application from the repository with python -m shopping_advisor.
# uv manages the environment and lock without a package build/install step.
package = false
