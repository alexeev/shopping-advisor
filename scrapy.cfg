# Scrapy project configuration.
#
# The default profile is the validated, proxy-free local one: it needs no
# credentials and no optional packages. `SCRAPY_PROJECT=baseline` selects the
# same settings and is kept because existing commands and reports name it.
# The optional ScrapeOps proxy/monitor integration is opt-in and needs
# `uv sync --locked --extra scrapeops` plus SCRAPEOPS_API_KEY in the
# environment.
#
# For more information about the [deploy] section see:
# https://scrapyd.readthedocs.io/en/latest/deploy.html

[settings]
default = shopping_advisor.settings
baseline = shopping_advisor.settings_baseline
scrapeops = shopping_advisor.settings_scrapeops

[deploy]
#url = http://localhost:6800/
project = shopping_advisor
